<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src ='index.js'></script>
</head>
<body>
    <div class ="page-container">
        <header>
            <h2>Create Account</h2>
        </header>
        <div class ="body-container">
            <div>
                <label class ="title">First name*</label>
                <input type ="text" placeholder ="enter your first name" required />
            </div>
            <div>
                <label class ="title">Last name</label>
                <input type ="text" placeholder ="enter your last name" required />
            </div>
            <div class ="full-width">
                <label class ="title">Email*</label>
                <input type ="email" placeholder ="enter your email" required />
            </div>
            <div>
                <label class ="title">Password*</label>
                <input type ="password" placeholder ="enter your password" required />
            </div>
            <div>
                <label class ="title">Confirm Password*</label>
                <input type ="password" placeholder ="enter your password again" required />
            </div>
            <div>
                <label class ="title">Gender</label>
                <div class ="inline-option">
                    <label><input type ="radio" name ="gender" /> Male</label>
                    <label><input type ="radio" name ="gender" /> Female</label>
                </div>
            </div>
            <div>
                <label class ="title">Hobbies</label>
                <div class ="inline-option">
                    <label><input type ="checkbox"/> Music</label>
                    <label><input type ="checkbox"/> Sports</label>
                    <label><input type ="checkbox"/> Travel</label>
                    <label><input type ="checkbox"/> Movies</label>
                </div>
            </div>
            <div>
                <label class ="title">Source of Income</label>
                <select>
                    <option>Employed</option>
                    <option>Self-Employed</option>
                    <option>Student</option>
                </select>
            </div>
            <div>
                <label class ="title">Income</label>
                <div class ="range-row">
                    <input type ="range" min ="0" max ="100" value ="20" />
                    <span class ="income-badge">20K</span>
                </div>
            </div>
            <div>
                <label class ="title">Upload Profile Picture</label>
                <input type ="file" />
            </div>
            <div>
                <label class ="title">Age</label>
                <input type ="number"
            </div>
            <div class ="full-width">
                <label class ="title">Bio</label>
                <textarea></textarea>
            </div>
        </div>
        <div class ="footer">
            <button type ="submit" class ="create-btn">Create</button>
        </div>
    </div>
    
</body>
</html>
