<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Information</title>
    <style>
        h2{
            font-family: sans-serif;
        }
        table {
            border-collapse:collapse;
            width:100%;
            max-width: 600px;
            font-family: sans-serif
        }
        thead{
            background-color: lightgray
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th{
            background-color:dcdcdc;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h2>Welcome to CADT Shop!</h2>
    <table>
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>In Stock</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>C# Book</td>
                <td>$10</td>
                <td>5</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>CADT Polo</td>
                <td>$20</td>
                <td>60</td>
                <td>Yes</td>
            </tr>
            <tr>
                <td>CADT mouse</td>
                <td>$100</td>
                <td>3</td>
                <td>No</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
