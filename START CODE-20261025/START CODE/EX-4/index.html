<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <img src="https://tse1.mm.bing.net/th/id/OIP.ETqIAr1EWp8urzSKxNblrQHaJ4?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="profile picture" class="profile-img">
        <h2 class="profile-name">An Keon-ho</h2>
        <p>Kpop Singer</p>
        
        <div class="stat-container">
            <div>
                <span class="stat-label">Performance</span>
                <span style="font-weight: bold; font-size: 18px; color: #333;">21</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Following</span>
                <span style="font-weight: bold; font-size: 18px; color: #333;">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Followers</span>
                <span style="font-weight: bold; font-size: 18px; color: #333;">1M</span>
            </div>
        </div>
        <p class="profile-bio">Driven by curiosity, guided by purpose, and inspired to leave every place better than he found it.</p>
        <button class="profile-btn">View Profile</button>
    </div>
    
</body>
</html>
