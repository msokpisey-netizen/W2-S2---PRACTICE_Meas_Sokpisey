<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            background-color: white;
            color : white;
            font-family:Arial, Helvetica, sans-serif;
            font-weight: bold;
        }

        .page-container{
            display: flex;
            flex-direction: column;
            padding: 1rem;
            min-height: 100vh;
            gap: 1rem;
        }

        .header, .main, .aside, .footer{
            border-radius: 0.5rem;
            padding: 1.5rem;
        } 

        .header{
            background-color: #1e90ff;
            box-shadow: 0 5px 0 #0077ea;
        }

        .middle-container{
            display: flex;
            flex-grow: 1;
            gap: 1rem;
        }

        .main{
            background-color: #3cb371;
            box-shadow: 0 5px 0 #2f8d59;
            display: flex;
            flex-grow: 1;
            flex-direction: column;
            gap: 1rem;
        }

        .item-container{
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .aside{
            background-color: #ff6347;
            box-shadow: 0 5px 0 #e02200;
        }

        .footer{
            background-color: #4169e1;
            box-shadow:0 5px 0 #1d44b8;
        }

        .item{
            display: flex;
            background-color: #2f8d59;
            box-shadow: 0 5px 0 #226741;
            border-radius: 0.5rem;
            height: 60px;
            width: 65px;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div class ="page-container">
        <header class ="header">header</header>

        <div class ="middle-container">
            <main class ="main">
                <div class ="section-title">main</div>
                <div class ="item-container">
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                    <div class ="item">item</div>
                </div>
            </main>
            <aside class ="aside">sidebar</aside>
        </div>
        <footer class ="footer">footer</footer>
    </div>
</body>
</html>
