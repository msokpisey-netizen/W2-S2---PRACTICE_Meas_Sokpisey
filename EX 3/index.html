<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Sono", sans-serif;
        background-color: #f2f4f8;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      .pricing-container {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: stretch;
        gap: 30px;
        max-width: 1000px;
        width: 100%;
      }

      .pricing-plan {
        background-color: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        padding-bottom: 35px;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .pricing-plan:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 35px rgba(0, 0, 0, 0.12);
      }

      .plan-title {
        width: 100%;
        padding: 24px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 25px;
      }

      .plan-price {
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 25px;
        text-align: center;
      }

      .plan-features {
        list-style: none;
        width: 80%;
        display: flex;
        flex-direction: column;
        margin-bottom: 35px;
      }

      .plan-features li {
        text-align: center;
        padding: 14px 0;
        font-size: 14px;
        color: #6b7280;
        border-top: 1px solid #eef0f4;
      }

      .plan-features li:last-child {
        border-bottom: 1px solid #eef0f4;
      }

      .plan-button {
        margin-top: auto;
        border: none;
        border-radius: 25px;
        padding: 12px 42px;
        color: #ffffff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        transition: background 0.3s ease, transform 0.2s ease;
      }

      /* Card 1 (Basic): Teal-Green Gradient from Document */
      .pricing-plan:nth-child(1) .plan-title,
      .pricing-plan:nth-child(1) .plan-button {
        background: linear-gradient(135deg, #00c9a7, #009efd);
      }
      .pricing-plan:nth-child(1) .plan-price {
        color: #00b8ba;
      }

      /* Card 2 (Standard): Blue-Indigo Gradient from Document */
      .pricing-plan:nth-child(2) .plan-title,
      .pricing-plan:nth-child(2) .plan-button {
        background: linear-gradient(135deg, #4facfe, #6a30ff);
      }
      .pricing-plan:nth-child(2) .plan-price {
        color: #4869d8;
      }

      /* Card 3 (Premium): Purple-Pink Gradient from Document */
      .pricing-plan:nth-child(3) .plan-title,
      .pricing-plan:nth-child(3) .plan-button {
        background: linear-gradient(135deg, #7f2ccb, #ff1e90);
      }
      .pricing-plan:nth-child(3) .plan-price {
        color: #7f2ccb;
      }

      /* Button Color Change on Mouse Hover */
      .pricing-plan:nth-child(n) .plan-button:hover {
        background: #222222;
        color: #ffffff;
        transform: translateY(-2px);
      }

      /* Hint: Media Query and Flexbox to stack vertically on smaller screens */
      @media (max-width: 1250px) {
        .pricing-container {
          flex-direction: column;
          align-items: center;
        }

        .pricing-plan {
          width: 100%;
          max-width: 380px;
        }
      }

    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
